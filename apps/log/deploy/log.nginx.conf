# 参考配置。正式环境可放到 /etc/nginx/conf.d/log.95chong.cn.conf。
# 域名 log.95chong.cn 直接托管 /opt/log/dist。
# 证书沿用服务器已有文件时，证书里必须包含 log.95chong.cn。

server {
    listen 80;
    listen [::]:80;
    server_name log.95chong.cn;

    location /.well-known/acme-challenge/ {
        allow all;
        root /home/admin/sgs-recharge-95/dist;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name log.95chong.cn;

    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/95chong.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /opt/log/dist;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
