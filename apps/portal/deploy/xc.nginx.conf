# 参考配置。正式环境写在服务器 /etc/nginx/conf.d/95chong.cn.conf。
# 域名 xc.95chong.cn 直接托管 /opt/xc/dist

server {
    listen 80;
    listen [::]:80;
    server_name xc.95chong.cn;

    location /.well-known/acme-challenge/ {
        allow all;
        root /home/admin/sgs-recharge-95/dist;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xc.95chong.cn;

    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/95chong.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /opt/xc/dist;
    index index.html;

    location = /downloads/manifest.json {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
