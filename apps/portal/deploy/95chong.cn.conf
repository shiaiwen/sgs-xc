# 主站 95chong.cn 托管小抄门户 /opt/xc/dist；/api/ 仍走本机 8787。
# gx.95chong.cn 观星后端；xc.95chong.cn 与主站同源目录。

server {
    listen 80;
    listen [::]:80;
    server_name 95chong.cn;

    location /.well-known/acme-challenge/ {
        allow all;
        root /home/admin/sgs-recharge-95/dist;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /opt/xc/dist;
    index index.html;

    location = /downloads/manifest.json {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 95chong.cn;

    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/95chong.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /opt/xc/dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        allow all;
        root /home/admin/sgs-recharge-95/dist;
        try_files $uri =404;
    }

    location = /downloads/manifest.json {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name gx.95chong.cn;

    location /.well-known/acme-challenge/ {
        allow all;
        root /home/admin/sgs-recharge-95/dist;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gx.95chong.cn;

    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/95chong.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:17322;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}

